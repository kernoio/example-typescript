id: register_user_missing_password_returns_422
description: Register user without password field returns 422 with validation error
  indicating password can't be blank
subject:
  type: Endpoint
  method: POST
  path: /api/users
steps:
- id: generate_user_data
  description: Generate email and username but omit password
  action:
    type: Values
    outputs:
      email:
        type: RandomUuid
      username:
        type: RandomUuid
- id: register_user_no_password
  description: Call POST /api/users without password field
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user": {"email": "{{ generate_user_data.email }}@test.com", "username": "{{ generate_user_data.username }}"}}
- id: assert_validation_error
  description: Assert 422 response with error indicating password can't be blank
  action:
    type: HttpAssert
    actual: '{{ register_user_no_password }}'
    expected: |-
      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/json; charset=utf-8

      {"errors": {"password": ["can't be blank"]}}
    body_match: json_lenient