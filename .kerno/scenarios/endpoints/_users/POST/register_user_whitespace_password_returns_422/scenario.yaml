id: register_user_whitespace_password_returns_422
description: Register user with whitespace-only password returns 422 with validation
  error (password is trimmed to empty string)
subject:
  type: Endpoint
  method: POST
  path: /api/users
steps:
- id: generate_user_data
  description: Generate email and username with whitespace password
  action:
    type: Values
    outputs:
      email:
        type: RandomUuid
      username:
        type: RandomUuid
      password:
        type: StaticString
        value: '   '
- id: register_user_whitespace_password
  description: Call POST /api/users with whitespace-only password
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {
        "user": {
          "email": "{{ generate_user_data.email }}@test.com",
          "username": "{{ generate_user_data.username }}",
          "password": "{{ generate_user_data.password }}"
        }
      }
- id: assert_validation_error
  description: Assert 422 response with error indicating password can't be blank
  action:
    type: HttpAssert
    actual: '{{ register_user_whitespace_password }}'
    expected: |-
      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/json; charset=utf-8

      {
        "errors": {
          "password": ["can't be blank"]
        }
      }
    body_match: json_lenient