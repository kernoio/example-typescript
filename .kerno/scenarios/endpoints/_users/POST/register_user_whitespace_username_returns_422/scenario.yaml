id: register_user_whitespace_username_returns_422
description: Register user with whitespace-only username returns 422 with validation
  error (username is trimmed to empty string)
subject:
  type: Endpoint
  method: POST
  path: /api/users
steps:
- id: generate_user_data
  description: Generate email and password with whitespace username
  action:
    type: Values
    outputs:
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      whitespace_username:
        type: StaticString
        value: '   '
- id: register_user_whitespace_username
  description: Call POST /api/users with whitespace-only username
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user":{"email":"{{ generate_user_data.email }}@test.com","username":"{{ generate_user_data.whitespace_username }}","password":"{{ generate_user_data.password }}"}}
- id: assert_validation_error
  description: Assert 422 response with error indicating username can't be blank
  action:
    type: HttpAssert
    actual: '{{ register_user_whitespace_username }}'
    expected: |-
      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/json; charset=utf-8

      {"errors":{"username":["can't be blank"]}}
    body_match: json_lenient