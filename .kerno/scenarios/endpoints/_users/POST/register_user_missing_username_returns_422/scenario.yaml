id: register_user_missing_username_returns_422
description: Register user without username field returns 422 with validation error
  indicating username can't be blank
subject:
  type: Endpoint
  method: POST
  path: /api/users
steps:
- id: generate_user_data
  description: Generate email and password but omit username
  action:
    type: Values
    outputs:
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
- id: register_user_no_username
  description: Call POST /api/users without username field
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user": {"email": "{{ generate_user_data.email }}@test.com", "password": "{{ generate_user_data.password }}"}}
- id: assert_validation_error
  description: Assert 422 response with error indicating username can't be blank
  action:
    type: HttpAssert
    actual: '{{ register_user_no_username }}'
    expected: |-
      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/json; charset=utf-8

      {"errors": {"username": ["can't be blank"]}}
    body_match: json_lenient