id: register_user_whitespace_email_returns_422
description: Register user with whitespace-only email returns 422 with validation
  error (email is trimmed to empty string)
subject:
  type: Endpoint
  method: POST
  path: /api/users
steps:
- id: generate_user_data
  description: Generate username and password with whitespace email
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      whitespace_email:
        type: StaticString
        value: '   '
- id: register_user_whitespace_email
  description: Call POST /api/users with whitespace-only email
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {
        "user": {
          "username": "{{ generate_user_data.username }}",
          "email": "{{ generate_user_data.whitespace_email }}",
          "password": "{{ generate_user_data.password }}"
        }
      }
- id: assert_validation_error
  description: Assert 422 response with error indicating email can't be blank
  action:
    type: HttpAssert
    actual: '{{ register_user_whitespace_email }}'
    expected: |-
      HTTP/1.1 422 Unprocessable Entity
      Content-Type: application/json; charset=utf-8

      {
        "errors": {
          "email": ["can't be blank"]
        }
      }
    body_match: json_lenient