id: get_current_user_authenticated_success
description: Authenticated user successfully retrieves their own profile with complete
  user data
subject:
  type: Endpoint
  method: GET
  path: /api/user
steps:
- id: generate_user_data
  description: Generate test user credentials
  action:
    type: Values
    outputs:
      email:
        type: RandomUuid
      username:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
- id: create_test_user
  description: Create a test user in the database via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user": {"email": "{{ generate_user_data.email }}@test.com", "username": "{{ generate_user_data.username }}", "password": "{{ generate_user_data.password }}"}}
- id: extract_user_id
  description: Extract user ID from database for token generation
  action:
    type: ExecuteSql
    sql: SELECT 'user_id' as key, id as value FROM "User" WHERE username = '{{ generate_user_data.username
      }}'
- id: generate_token
  description: Generate JWT token for authentication
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "id": {{ extract_user_id.user_id }}
        }
      }
- id: call_get_user
  description: Call GET /api/user with valid authentication token
  action:
    type: CallHttp
    request: |-
      GET /api/user HTTP/1.1
      Authorization: Token {{ generate_token }}
- id: assert_success_response
  description: Assert 200 OK response with complete user data including id, email,
    username, bio, image, and token
  action:
    type: HttpAssert
    actual: '{{ call_get_user }}'
    expected: |-
      HTTP/1.1 200 OK
      Content-Type: application/json; charset=utf-8

      {"user": {"email": "{{ generate_user_data.email }}@test.com", "username": "{{ generate_user_data.username }}"}}
    body_match: json_lenient
- id: cleanup_user
  description: Delete the test user from database
  action:
    type: ExecuteSql
    sql: DELETE FROM "User" WHERE username = '{{ generate_user_data.username }}'