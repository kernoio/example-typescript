name: Kerno Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  kerno-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install kerno-cli from fecore (cli branch)
        env:
          GH_TOKEN: ${{ secrets.ANTOINE_ACCESS_TOKEN }}
        run: |
          git clone -b cli --depth 1 https://${GH_TOKEN}@github.com/kernoio/fecore.git /tmp/fecore
          cd /tmp/fecore/kerno-cli
          npm install
          npm run build

      - name: Run kerno status
        env:
          KERNO_ACCESS_TOKEN: ${{ secrets.KERNO_ACCESS_TOKEN }}
        run: |
          echo "" | /tmp/fecore/kerno-cli/dist/cli.js status

      - name: Run kerno start compose
        env:
          KERNO_ACCESS_TOKEN: ${{ secrets.KERNO_ACCESS_TOKEN }}
        run: |
          echo "" | /tmp/fecore/kerno-cli/dist/cli.js start

      - name: Run kerno tests
        env:
          KERNO_ACCESS_TOKEN: ${{ secrets.KERNO_ACCESS_TOKEN }}
        run: |
          node /tmp/fecore/kerno-cli/dist/cli.js run /users -m POST

